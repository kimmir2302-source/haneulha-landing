<style>
/* =============================================
   DESIGN TOKENS
   Palette: Deep Night Seoul × Neon Tokyo
   #0A0B1A  -- abyss (background base)
   #12102E  -- deep navy layer
   #2D1B69  -- violet deep
   #6B3FA0  -- amethyst
   #C084FC  -- lavender glow
   #F472B6  -- dawn pink
   #E2E8F0  -- star white (text)
   #94A3B8  -- moon gray (secondary text)
   Accent:  #00FFD1  -- neon aqua (CTA)
============================================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --abyss:      #0A0B1A;
  --deep-navy:  #12102E;
  --violet:     #2D1B69;
  --amethyst:   #6B3FA0;
  --lavender:   #C084FC;
  --dawn-pink:  #F472B6;
  --star-white: #E2E8F0;
  --moon-gray:  #94A3B8;
  --neon-aqua:  #00FFD1;
  --neon-glow:  rgba(0, 255, 209, 0.25);

  --font-display: 'Space Grotesk', 'Noto Sans KR', sans-serif;
  --font-body:    'DM Sans', 'Noto Sans KR', sans-serif;
  --font-jp:      'Noto Sans JP', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background-color: var(--abyss);
  color: var(--star-white);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── STARFIELD CANVAS ── */
#star-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ── GRADIENT BG LAYERS ── */
.bg-layers {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.bg-layers::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(107, 63, 160, 0.45) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 5%,  rgba(244, 114, 182, 0.18) 0%, transparent 55%),
    radial-gradient(ellipse 70% 80% at 50% 100%,rgba(45, 27, 105, 0.6)  0%, transparent 70%),
