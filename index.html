<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하늘下 (Haneul-Ha) — 한일 스와이프 매칭 플랫폼</title>
<meta name="description" content="같은 하늘 아래, 국경 없는 기회를 스와이프하다. 한일 최초의 쌍방향 스와이프 매칭 플랫폼.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Sans+JP:wght@300;400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
/* =============================================
   DESIGN TOKENS
   Palette: Deep Night Seoul × Neon Tokyo
   #0A0B1A  -- abyss (background base)
   #12102E  -- deep navy layer
   #2D1B69  -- violet deep
   #6B3FA0  -- amethyst
   #C084FC  -- lavender glow
   #F472B6  -- dawn pink
   #E2E8F0  -- star white (text)
   #94A3B8  -- moon gray (secondary text)
   Accent:  #00FFD1  -- neon aqua (CTA)
============================================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --abyss:      #0A0B1A;
  --deep-navy:  #12102E;
  --violet:     #2D1B69;
  --amethyst:   #6B3FA0;
  --lavender:   #C084FC;
  --dawn-pink:  #F472B6;
  --star-white: #E2E8F0;
  --moon-gray:  #94A3B8;
  --neon-aqua:  #00FFD1;
  --neon-glow:  rgba(0, 255, 209, 0.25);

  --font-display: 'Space Grotesk', 'Noto Sans KR', sans-serif;
  --font-body:    'DM Sans', 'Noto Sans KR', sans-serif;
  --font-jp:      'Noto Sans JP', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background-color: var(--abyss);
  color: var(--star-white);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── STARFIELD CANVAS ── */
#star-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ── GRADIENT BG LAYERS ── */
.bg-layers {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.bg-layers::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(107, 63, 160, 0.45) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 5%,  rgba(244, 114, 182, 0.18) 0%, transparent 55%),
    radial-gradient(ellipse 70% 80% at 50% 100%,rgba(45, 27, 105, 0.6)  0%, transparent 70%),
    linear-gradient(160deg, #0A0B1A 0%, #12102E 40%, #1a0f3a 70%, #0d0b1f 100%);
}
.bg-layers::after {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(192, 132, 252, 0.08) 0%, transparent 70%);
  top: -100px; left: 50%;
  transform: translateX(-50%);
  animation: pulseglow 8s ease-in-out infinite alternate;
}
@keyframes pulseglow {
  from { transform: translateX(-50%) scale(1);   opacity: 0.5; }
  to   { transform: translateX(-50%) scale(1.3); opacity: 1;   }
}

/* ── LAYOUT ── */
.site-wrapper {
  position: relative;
  z-index: 1;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10, 11, 26, 0.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(192, 132, 252, 0.1);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--star-white);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-logo .kanji {
  font-family: var(--font-jp);
  color: var(--lavender);
  font-size: 22px;
}
.nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(192, 132, 252, 0.12);
  border: 1px solid rgba(192, 132, 252, 0.3);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--lavender);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.nav-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--neon-aqua);
  box-shadow: 0 0 6px var(--neon-aqua);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.3; }
}

/* ── HERO ── */
.hero {
  padding: 160px 0 100px;
  text-align: center;
  position: relative;
}

/* Vertical brand name */
.brand-vertical {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 40px;
  gap: 0;
}
.brand-vertical .kr-top {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: clamp(48px, 8vw, 80px);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
  background: linear-gradient(135deg, #E2E8F0 0%, #C084FC 50%, #F472B6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-vertical .kanji-char {
  font-family: var(--font-jp);
  font-size: clamp(36px, 6vw, 60px);
  font-weight: 300;
  color: rgba(192, 132, 252, 0.5);
  letter-spacing: 0.1em;
  line-height: 1;
  margin-top: -4px;
}
.brand-vertical .en-sub {
  font-family: var(--font-display);
  font-size: clamp(11px, 1.8vw, 14px);
  font-weight: 400;
  letter-spacing: 0.35em;
  color: var(--moon-gray);
  text-transform: uppercase;
  margin-top: 10px;
}

.hero-tag {
  display: inline-block;
  background: linear-gradient(90deg, rgba(0,255,209,0.1), rgba(192,132,252,0.1));
  border: 1px solid rgba(0,255,209,0.25);
  border-radius: 100px;
  padding: 5px 18px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--neon-aqua);
  margin-bottom: 28px;
}

.hero-headline {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: clamp(26px, 5vw, 48px);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--star-white);
  margin-bottom: 24px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}
.hero-headline .accent {
  background: linear-gradient(90deg, var(--lavender), var(--dawn-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: clamp(13px, 2vw, 16px);
  font-weight: 300;
  line-height: 1.85;
  color: var(--moon-gray);
  max-width: 560px;
  margin: 0 auto 48px;
}
.hero-sub strong {
  color: var(--lavender);
  font-weight: 500;
}

/* Stats strip */
.stats-strip {
  display: flex;
  justify-content: center;
  gap: 48px;
  margin-bottom: 0;
  flex-wrap: wrap;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--neon-aqua), var(--lavender));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: block;
}
.stat-label {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  color: var(--moon-gray);
  letter-spacing: 0.05em;
  margin-top: 2px;
}

/* ── DIVIDER ── */
.section-divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(192,132,252,0.25), transparent);
  margin: 80px 0;
}

/* ── PHONE DEMO ── */
.demo-section {
  padding: 20px 0 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.section-label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--lavender);
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 700;
  color: var(--star-white);
  text-align: center;
  margin-bottom: 12px;
}
.section-desc {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  color: var(--moon-gray);
  text-align: center;
  margin-bottom: 56px;
  max-width: 440px;
}

/* Phone frame */
.phone-scene {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

.phone-wrapper {
  position: relative;
  width: 300px;
}

/* Ambient glow behind phone */
.phone-wrapper::before {
  content: '';
  position: absolute;
  inset: -40px;
  background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(107,63,160,0.3), transparent 70%);
  border-radius: 50%;
  z-index: 0;
  animation: phoneglow 6s ease-in-out infinite alternate;
}
@keyframes phoneglow {
  from { opacity: 0.6; transform: scale(1); }
  to   { opacity: 1;   transform: scale(1.05); }
}

.phone-frame {
  position: relative;
  z-index: 1;
  width: 300px;
  height: 600px;
  background: #0d0c1f;
  border-radius: 44px;
  border: 2.5px solid rgba(192, 132, 252, 0.4);
  box-shadow:
    0 0 0 6px rgba(192,132,252,0.06),
    0 0 60px rgba(107,63,160,0.5),
    0 40px 80px rgba(10,11,26,0.8),
    inset 0 1px 0 rgba(255,255,255,0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Phone notch */
.phone-notch {
  width: 100%;
  padding: 14px 0 0;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
}
.notch-pill {
  width: 90px;
  height: 28px;
  background: #050508;
  border-radius: 100px;
  border: 1.5px solid rgba(192,132,252,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.notch-camera {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #1a1a2e;
  border: 1.5px solid rgba(192,132,252,0.3);
}
.notch-sensor {
  width: 24px; height: 4px;
  border-radius: 2px;
  background: #1a1a2e;
}

/* Phone status bar */
.phone-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 20px;
  flex-shrink: 0;
}
.status-time {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: var(--star-white);
}
.status-icons {
  display: flex;
  gap: 4px;
  align-items: center;
}
.status-icons span {
  font-size: 11px;
  color: var(--star-white);
}

/* App header inside phone */
.app-header {
  padding: 8px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(192,132,252,0.1);
  flex-shrink: 0;
}
.app-logo-text {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--lavender), var(--dawn-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.app-header-right {
  display: flex;
  gap: 10px;
}
.app-icon-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(192,132,252,0.1);
  border: 1px solid rgba(192,132,252,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

/* Card stack area */
.card-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Stack cards behind */
.card-stack-bg {
  position: absolute;
  top: 18px; left: 22px; right: 22px;
  height: calc(100% - 28px);
  background: rgba(255,255,255,0.03);
  border-radius: 20px;
  border: 1px solid rgba(192,132,252,0.08);
  transform: rotate(3deg);
}
.card-stack-bg2 {
  position: absolute;
  top: 12px; left: 18px; right: 18px;
  height: calc(100% - 22px);
  background: rgba(255,255,255,0.04);
  border-radius: 20px;
  border: 1px solid rgba(192,132,252,0.12);
  transform: rotate(-1.5deg);
}

/* Main swipe card */
.swipe-card {
  position: relative;
  z-index: 3;
  width: 100%;
  border-radius: 20px;
  background: linear-gradient(145deg, #1a1035 0%, #150d2e
